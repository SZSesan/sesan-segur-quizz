20000\" placeholder=\"Sur quoi nous appuyons-nous ? De quoi avons-nous encore besoin ?\">${esc(p.justification)}<\/textarea><\/label>${p.confiance!==null&&!p.justification.trim()?'<p class=\"cpts-soft-warning\">Ajoutez la justification demand\u00e9e dans la planche.<\/p>':''}`;}\nfunction cptsPitchBoard(){const p=cptsState().pitch,withinMissions=cptsClock().id.startsWith('mission:');$('mainContent').innerHTML=`<section class=\"cpts-pitch\"><header class=\"cpts-pitch-heading\"><div><p class=\"eyebrow\">Fiche commune de restitution<\/p><h1>Quel discours aupr\u00e8s des CPTS ?<\/h1><p>Mieux parler eSant\u00e9 pour faire des CPTS des relais aupr\u00e8s des professionnels.<\/p><\/div><button class=\"btn secondary\" data-action=\"cpts-return\">\u2190 Revenir ${cptsState().previousMode==='missions'?'\u00e0 la mission':'au parcours'}<\/button><\/header><p class=\"cpts-pitch-timing\">${withinMissions?'\u00c0 renseigner pendant les trois missions de 30 minutes. Aucun temps suppl\u00e9mentaire n\u2019est ajout\u00e9.':'S\u00e9quence de 45 minutes, conform\u00e9ment \u00e0 la planche n\u00b02 des ateliers parcours.'} Cette fiche pr\u00e9pare la restitution en pl\u00e9ni\u00e8re.<\/p>\n <section class=\"pitch-panel pitch-arguments\"><h2><span>1<\/span> Les arguments \u00e0 faire entendre<\/h2><p>Quels arguments utiliser pour int\u00e9grer le volet num\u00e9rique dans le projet de sant\u00e9 et les ACI ? Faites le lien avec les missions de la CPTS, au-del\u00e0 des seuls parcours.<\/p><textarea data-cpts-pitch-field=\"arguments\" rows=\"4\" maxlength=\"20000\" placeholder=\"Partir des objectifs des professionnels, pr\u00e9ciser le b\u00e9n\u00e9fice, proposer un premier usage\u2026\">${esc(p.arguments)}<\/textarea><\/section>\n <section class=\"pitch-panel\"><div class=\"pitch-panel-head\"><h2><span>2<\/span> Les objections et nos r\u00e9ponses<\/h2><button class=\"btn secondary small\" data-action=\"cpts-add-objection\">+ Ajouter une objection<\/button><\/div><div class=\"pitch-objections\">${p.objections.map(o=>`<button data-action=\"cpts-edit-objection\" data-id=\"${o.id}\"><div><small>Objection de la CPTS<\/small><p>${esc(o.objection||'\u00c0 renseigner\u2026')}<\/p><\/div><div><small>R\u00e9ponse propos\u00e9e<\/small><p>${esc(o.reponse||'\u00c0 construire ensemble\u2026')}<\/p><\/div><b>\u270e<\/b><\/button>`).join('')||'<p class=\"pack-help\">Ajoutez les objections que vous entendez et les r\u00e9ponses construites ensemble.<\/p>'}<\/div><\/section>\n <div class=\"pitch-bottom-grid\"><section class=\"pitch-panel pitch-phrase\"><h2><span>3<\/span> Une phrase pour convaincre<\/h2><textarea data-cpts-pitch-field=\"phrase\" rows=\"5\" maxlength=\"20000\" placeholder=\"La phrase que nous pourrions vraiment dire \u00e0 une CPTS\u2026\">${esc(p.phrase)}<\/textarea><button class=\"text-btn\" data-action=\"cpts-see-contributions\">Relire les \u00e9l\u00e9ments de langage du groupe \u24d8<\/button><\/section><section class=\"pitch-panel\"><div class=\"pitch-panel-head\"><h2><span>4<\/span> Les ressources utiles<\/h2><button class=\"text-btn\" data-action=\"cpts-pick-resources\">+ Choisir<\/button><\/div><div class=\"pitch-resources\">${p.resources.map(e=>`<button data-action=\"cpts-edit-resource\" data-entry=\"${e.id}\" data-tip=\"${esc(ExcoPack.toolTip(getCard('tools',e.cardId)))}\">${cptsImage('tools',e)?`<img src=\"${cptsImage('tools',e)}\" alt=\"\">`:'<b>\u2605<\/b>'}<span>${esc(Cpts.entryLabel('tools',e))}<\/span><\/button>`).join('')}<\/div><label class=\"pack-label\">Supports, d\u00e9monstrations, liens \u00e0 partager<textarea data-cpts-pitch-field=\"ressourcesTexte\" rows=\"3\" maxlength=\"20000\" placeholder=\"Nommez la ressource et indiquez comment la retrouver\u2026\">${esc(p.ressourcesTexte)}<\/textarea><\/label><\/section><section class=\"pitch-panel\"><h2><span>5<\/span> Notre confiance pour embarquer les CPTS<\/h2>${cptsConfidenceMarkup(p)}<\/section><\/div>\n <details class=\"pitch-panel pitch-next\"><summary>Notre d\u00e9marche d\u2019aller-vers<\/summary><p class=\"pack-help\">Compl\u00e9ment au support : rendre la prise de contact concr\u00e8te, avec un acteur, un bon moment, un message et une action.<\/p>${p.actions.map(a=>`<button class=\"next-action\" data-action=\"cpts-edit-action\" data-id=\"${a.id}\"><strong>${esc(a.action||'Action \u00e0 pr\u00e9ciser')}<\/strong><span>${esc([a.acteurCle,a.pilote,a.echeance].filter(Boolean).join(' \u00b7 '))}<\/span><b>\u270e<\/b><\/button>`).join('')}<button class=\"btn secondary small\" data-action=\"cpts-add-action\">+ Pr\u00e9parer une action<\/button><\/details>\n <section class=\"cpts-export-line\"><p>Les cartes, les \u00e9changes des deux ateliers et cette fiche sont conserv\u00e9s ensemble.<\/p><div><button class=\"btn coral\" data-action=\"submit-results\">Transmettre le travail<\/button><button class=\"btn secondary\" data-action=\"export-report\">Compte rendu illustr\u00e9<\/button><button class=\"btn secondary\" data-action=\"export-csv\">D\u00e9tails Excel \u00b7 CSV<\/button><\/div><\/section><p class=\"cpts-source-line\">Rubriques reprises des planches n\u00b02 des ateliers parcours, diapositives 5, 10 et 15 du support fourni. Aucune r\u00e9ponse n\u2019est pr\u00e9remplie.<\/p><\/section>`;}\nfunction cptsEditObjection(id){const p=cptsState().pitch;let row=p.objections.find(o=>o.id===id);if(!row){row={id:uid(),objection:'',reponse:'',pointAConfirmer:'',source:''};p.objections.push(row);persist();}M={type:'cpts-objection',row};showDialog({title:'Une objection et la r\u00e9ponse du groupe',eyebrow:'Discours aupr\u00e8s des CPTS',subtitle:'Enregistrement automatique, y compris si vous fermez la fen\u00eatre.',body:`<div class=\"form-grid\">${[['objection','Objection de la CPTS'],['reponse','Notre r\u00e9ponse'],['pointAConfirmer','Ce qui reste \u00e0 v\u00e9rifier'],['source','Ressource ou source de la r\u00e9ponse']].map(([k,label])=>`<label class=\"field\">${label}<textarea data-cpts-row-field=\"${k}\" rows=\"4\" maxlength=\"20000\">${esc(row[k])}<\/textarea><\/label>`).join('')}<\/div>`,footer:'<span class=\"small\">La r\u00e9ponse reste une contribution du groupe.<\/span><div><button class=\"text-btn\" data-action=\"cpts-remove-row\">Retirer<\/button><button class=\"btn coral\" data-action=\"cancel-dialog\">Terminer<\/button><\/div>'});}\nfunction cptsEditAction(id){const p=cptsState().pitch;let row=p.actions.find(o=>o.id===id);if(!row){row={id:uid(),...Object.fromEntries(Cpts.actionFields.map(k=>[k,'']))};p.actions.push(row);persist();}M={type:'cpts-action',row};showDialog({title:'Pr\u00e9parer une d\u00e9marche d\u2019aller-vers',eyebrow:'De la discussion \u00e0 la prise de contact',subtitle:'Compl\u00e9ment propos\u00e9 \u00e0 partir des objectifs de la journ\u00e9e.',body:`<div class=\"form-grid\">${Cpts.actionFields.map(k=>`<label class=\"field\">${esc(Cpts.labels[k])}<textarea data-cpts-row-field=\"${k}\" rows=\"2\" maxlength=\"20000\">${esc(row[k])}<\/textarea><\/label>`).join('')}<\/div>`,footer:'<span class=\"small\">Enregistrement automatique.<\/span><div><button class=\"text-btn\" data-action=\"cpts-remove-row\">Retirer<\/button><button class=\"btn coral\" data-action=\"cancel-dialog\">Terminer<\/button><\/div>'});}\nfunction cptsAdminMarkup(groups){const units=Cpts.units(groups);return `<section class=\"entry-section\"><h2>Les missions et le discours CPTS<\/h2><p class=\"pack-help\">Chaque saisie conserve son groupe d\u2019origine. Les exemples et les points \u00e0 confirmer ne deviennent pas des consensus.<\/p><div class=\"cpts-admin-missions\">${Cpts.missions.map(m=>`<button data-action=\"cpts-admin-filter\" data-id=\"${m.id}\" class=\"${cptsAdminFilter===m.id?'active':''}\"><b>${units.filter(u=>u.m.id===m.id).length}<\/b><span>${esc(m.name)}<\/span><small>groupes ayant choisi ou renseign\u00e9 la mission<\/small><\/button>`).join('')}<\/div><button class=\"text-btn\" data-action=\"cpts-admin-filter\" data-id=\"all\">Voir les trois missions<\/button>${groups.filter(s=>Cpts.hasWork(s)||s.cpts.assignment==='missions').map(s=>{const p=s.cpts.pitch,us=Cpts.units([s]).filter(u=>cptsAdminFilter==='all'||u.m.id===cptsAdminFilter);return `<article class=\"cpts-admin-group\"><div class=\"pitch-panel-head\"><h3>${esc(s.name)}<\/h3><button class=\"text-btn\" data-action=\"cpts-admin-open\" data-id=\"${s.id}\" data-mode=\"pitch\">Ouvrir la fiche CPTS<\/button><\/div><p>${esc(s.department)} \u00b7 ${esc(Cpts.groupLabel(s))}<\/p><blockquote>${esc(p.phrase||'Phrase pour convaincre non renseign\u00e9e.')}<\/blockquote><p><b>Confiance : ${p.confiance===null?'non \u00e9valu\u00e9e':p.confiance+'/10'}<\/b><br>${nl(p.justification||'Justification \u00e0 compl\u00e9ter.')}<\/p>${us.map(({m,state:x})=>`<section><h4>${esc(m.title)} \u00b7 ${x.tools.length} solution(s)<\/h4><p>${esc(x.tools.map(e=>Cpts.entryLabel('tools',e)).join(', ')||'Aucune carte choisie.')}<\/p><button class=\"text-btn\" data-action=\"cpts-admin-open\" data-id=\"${s.id}\" data-mode=\"missions\" data-mission=\"${m.id}\">Relire la planche<\/button><\/section>`).join('')}<\/article>`;}).join('')||'<p class=\"empty\">Importez les JSON des groupes pour retrouver leurs missions et leur discours CPTS.<\/p>'}<\/section>`;}\nfunction cptsRules(){M={type:'cpts-rules'};showDialog({title:'Les deux ateliers du prototype',eyebrow:'Consignes du support fourni',body:'<ol class=\"rules-list\"><li><strong>Atelier parcours<\/strong><p>Choisir un parcours patient. Compl\u00e9ter les moments cl\u00e9s avec plusieurs cartes et au moins deux irritants. Pr\u00e9voir 45 minutes de jeu, puis 45 minutes pour la fiche \u00ab Quel discours aupr\u00e8s des CPTS ? \u00bb.<\/p><\/li><li><strong>Atelier missions CPTS<\/strong><p>Trois planches de 30 minutes : recherche de m\u00e9decin traitant, soins non programm\u00e9s de ville, pr\u00e9vention. Pour chaque solution choisie, pr\u00e9ciser la fonctionnalit\u00e9, son utilit\u00e9 pour la mission et les questions / objections avec les r\u00e9ponses apport\u00e9es.<\/p><\/li><li><strong>La restitution<\/strong><p>Conserver les arguments, objections / r\u00e9ponses, phrase pour convaincre, ressources utiles et confiance sur 10 avec justification. Pour l\u2019atelier missions, compl\u00e9ter cette fiche pendant les s\u00e9quences, sans ajouter une nouvelle s\u00e9quence de 45 minutes.<\/p><\/li><li><strong>Les cartes<\/strong><p>Plusieurs solutions et plusieurs jokers sont possibles. Les \u00e9toiles recueillent l\u2019appr\u00e9ciation du groupe, sans note pr\u00e9remplie. Pour l\u2019\u00e9quipement, 5 signifie une difficult\u00e9 \u00e9lev\u00e9e.<\/p><\/li><\/ol><p class=\"small\">La d\u00e9marche d\u2019aller-vers et les pistes de discussion sont des compl\u00e9ments d\u2019animation. Exportez le JSON pour transmettre les r\u00e9ponses \u00e0 l\u2019animateur.<\/p>',footer:'<button class=\"btn\" data-action=\"cancel-dialog\">Revenir au prototype<\/button>'});}\nfunction handleCptsAction(action,button){\n if(action==='cpts-workspace'){cptsChangeMode(button.dataset.mode);return true;}\n if(action==='cpts-return'){cptsChangeMode(cptsState().previousMode);return true;}\n if(action==='cpts-mission'){cptsChangeMission(button.dataset.id);return true;}\n if(action==='cpts-entry-workshop'){registration.cptsAssignment=button.dataset.mode;rememberEntry();renderRegistration();return true;}\n if(action==='cpts-entry-mission'){registration.cptsMission=button.dataset.id;rememberEntry();renderRegistration();return true;}\n if(action==='cpts-pick'){cptsOpenPicker(button.dataset.kind);return true;}\n if(action==='cpts-pick-resources'){cptsOpenPicker('tools','resources');return true;}\n if(action==='cpts-edit-resource'){cptsOpenEntry('tools',button.dataset.entry,'usage','resources');return true;}\n if(action==='cpts-edit-entry'){cptsOpenEntry(button.dataset.kind,button.dataset.entry,button.dataset.tab||'usage');return true;}\n if(action==='cpts-card-tab'){if(M?.type==='cpts-card'){M.tab=button.dataset.tab;cptsRenderEntry();}return true;}\n if(action==='cpts-rating'){if(M?.type==='cpts-card'&&Cpts.criteria.includes(button.dataset.key)){M.entry.ratings[button.dataset.key]=Number(button.dataset.value)||null;persist();cptsRenderEntry();}return true;}\n if(action==='cpts-remove-entry'){if(M?.type==='cpts-card'){const list=M.target==='resources'?cptsState().pitch.resources:cptsMissionState()[M.kind],at=list.findIndex(e=>e.id===M.entry.id);if(at>=0)list.splice(at,1);persist();closeDialog();render();}return true;}\n if(action==='save-picker'&&M?.cptsTarget){cptsSavePicker();return true;}\n if(action==='picker-context'&&M?.cptsTarget){const m=Cpts.missions.find(m=>m.id===M.cptsTarget.mission);$('cardInfoPanel').innerHTML='<button class=\"close-btn\" data-action=\"hide-info\" aria-label=\"Fermer le d\u00e9tail\">\u00d7<\/button><h3>'+esc(m.title)+'<\/h3><p>'+esc(m.question)+'<\/p><p class=\"small\">Plusieurs cartes possibles. Pr\u00e9cisez la fonctionnalit\u00e9, son utilit\u00e9 et les objections / r\u00e9ponses.<\/p>';$('cardInfoPanel').hidden=false;return true;}\n if(action==='cpts-source'){const m=cptsMission();M={type:'cpts-source'};showDialog({title:m.title,eyebrow:'Atelier 4 \u00b7 planche '+m.number+' \u00b7 30 minutes',body:'<p class=\"step-full-description\">'+esc(m.question)+'<\/p><p>Utilisez les cartes \u00e0 votre disposition pour vous inspirer. Certaines cartes servent \u00e0 g\u00e9n\u00e9rer la discussion et \u00e0 trouver les bons \u00e9l\u00e9ments de langage face aux questions ou irritants des professionnels.<\/p><h3 class=\"cpts-prompt-title\">Pistes de discussion propos\u00e9es pour le prototype<\/h3><ul>'+m.prompts.map(t=>'<li>'+esc(t)+'<\/li>').join('')+'<\/ul><p class=\"small\">Consigne source : diapositive '+m.slide+' du support fourni. Les pistes ci-dessus compl\u00e8tent cette consigne.<\/p>',footer:'<button class=\"btn\" data-action=\"cancel-dialog\">Revenir \u00e0 la planche<\/button>',narrow:true});return true;}\n if(action==='cpts-see-contributions'){const rows=ExcoPack.contributions([ses
