":\"En consultation, retrouver une lettre de liaison d\u00e9pos\u00e9e apr\u00e8s une hospitalisation.\",\"benefit\":\"Disposer d\u2019informations de soins partag\u00e9es pour la continuit\u00e9 du suivi.\",\"conditions\":\"V\u00e9rifier les droits d\u2019acc\u00e8s, l\u2019autorisation du patient et la disponibilit\u00e9 des documents. L\u2019acc\u00e8s d\u00e9pend du profil et du logiciel.\",\"first\":\"Identifier votre acc\u00e8s au DMP, ouvrir le dossier autoris\u00e9 et rechercher un document utile.\",\"limits\":\"Le dossier professionnel reste n\u00e9cessaire. Une information urgente demande aussi un circuit d\u2019alerte adapt\u00e9.\",\"sources\":[{\"label\":\"Assurance Maladie \u00b7 DMP en pratique\",\"url\":\"https://www.ameli.fr/medecin/sante-prevention/dmp-et-mon-espace-sante/dmp-en-pratique\"},{\"label\":\"Cnam \u00b7 Tutoriel Web PS\",\"url\":\"https://www.dmp.fr/tutoriel-webPS-DMP\"}],\"status\":\"Pr\u00e9sentation courte v\u00e9rifi\u00e9e sur les pages officielles le 20/10/2026. Les modalit\u00e9s d\u00e9taill\u00e9es restent li\u00e9es au profil et au logiciel.\"},\"mes\":{\"purpose\":\"Permettre au patient de retrouver et partager ses informations de sant\u00e9.\",\"people\":\"Les usagers ; les repr\u00e9sentants l\u00e9gaux pour les profils des enfants.\",\"features\":[\"Dossier m\u00e9dical et profil m\u00e9dical\",\"Messagerie de sant\u00e9 et catalogue de services\"],\"example\":\"Le patient retrouve ses r\u00e9sultats et les documents partag\u00e9s au fil de son suivi.\",\"benefit\":\"Faciliter l\u2019implication du patient dans son suivi.\",\"conditions\":\"Pr\u00e9voir un accompagnement adapt\u00e9 \u00e0 l\u2019autonomie num\u00e9rique de la personne. Respecter les r\u00e8gles de la messagerie.\",\"first\":\"Pr\u00e9senter les fonctions utiles et guider la personne vers son propre profil.\",\"limits\":\"Le professionnel utilise ses acc\u00e8s professionnels au DMP et \u00e0 MSSant\u00e9.\",\"sources\":[{\"label\":\"Assurance Maladie \u00b7 Mon espace sant\u00e9\",\"url\":\"https://www.ameli.fr/assure/sante/mon-espace-sante\"},{\"label\":\"Mon espace sant\u00e9 \u00b7 Messagerie\",\"url\":\"https://www.monespacesante.fr/questions-frequentes/utiliser-ma-messagerie\"}],\"status\":\"Supports de l\u2019atelier \u00b7 20/10/2026. Modalit\u00e9s selon le territoire et l\u2019\u00e9quipement.\"},\"mss\":{\"purpose\":\"Transmettre des informations de sant\u00e9 dans l\u2019Espace de confiance MSSant\u00e9.\",\"people\":\"Les professionnels et structures habilit\u00e9s ; \u00e9changes vers la messagerie du patient selon le service.\",\"features\":[\"Envoi de documents \u00e0 un destinataire identifi\u00e9\",\"Messagerie de sant\u00e9 vers Mon espace sant\u00e9\"],\"example\":\"Adresser les \u00e9l\u00e9ments utiles au professionnel qui poursuit la prise en charge.\",\"benefit\":\"Faire parvenir l\u2019information \u00e0 son destinataire dans un cadre pr\u00e9vu pour les donn\u00e9es de sant\u00e9.\",\"conditions\":\"V\u00e9rifier la bo\u00eete, le destinataire et les habilitations.\",\"first\":\"Rep\u00e9rer sa bo\u00eete MSSant\u00e9 et celle du destinataire, puis tester le circuit d\u2019\u00e9change.\",\"limits\":\"D\u00e9finir qui lit la bo\u00eete, quand et comment les messages sont trait\u00e9s.\",\"sources\":[{\"label\":\"MSSant\u00e9\",\"url\":\"https://www.esante-occitanie.fr/kit-communication/kit-communication-services-socles/\"}],\"status\":\"Supports de l\u2019atelier \u00b7 20/10/2026. Modalit\u00e9s selon le territoire et l\u2019\u00e9quipement.\"},\"santelien\":{\"purpose\":\"Organiser la coordination autour d\u2019une personne suivie.\",\"people\":\"Les professionnels franciliens des secteurs sanitaire, m\u00e9dico-social et social.\",\"features\":[\"Cercle de soins et cahier de liaison\",\"T\u00e2ches et sollicitation d\u2019\u00e9quipes ressources\"],\"example\":\"Les intervenants partagent une information de coordination et identifient qui prend la suite.\",\"benefit\":\"Rendre les informa oire et l\u2019\u00e9quipement.\"},\"ressources-cpts\":{\"purpose\":\"Partager les contacts, parcours et ressources propres \u00e0 la CPTS.\",\"people\":\"La CPTS, ses membres et ses partenaires selon les acc\u00e8s pr\u00e9vus.\",\"features\":[\"Annuaire et contacts locaux\",\"Protocoles, parcours et offre de pr\u00e9vention\"],\"example\":\"Retrouver la liste locale des ressources de sport-sant\u00e9.\",\"benefit\":\"Rendre accessibles les ressources d\u00e9j\u00e0 organis\u00e9es par le collectif.\",\"conditions\":\"Pr\u00e9ciser qui actualise les contenus et qui peut les consulter.\",\"first\":\"Identifier l\u2019espace existant et v\u00e9rifier ensemble un contact ou un parcours.\",\"limits\":\"La forme et les fonctionnalit\u00e9s varient selon la CPTS.\",\"sources\":[],\"status\":\"Supports de l\u2019atelier \u00b7 20/10/2026. Modalit\u00e9s selon le territoire et l\u2019\u00e9quipement.\"},\"doctolib\":{\"purpose\":\"Utiliser les services propos\u00e9s par une plateforme commerciale selon son offre.\",\"people\":\"Les patients et les professionnels, selon les modules et contrats.\",\"features\":[\"Prise de rendez-vous en ligne\",\"Autres services \u00e0 identifier par leur nom exact\"],\"example\":\"Le patient r\u00e9serve un cr\u00e9neau propos\u00e9 par un professionnel utilisateur.\",\"benefit\":\"Soutenir un besoin identifi\u00e9 selon le module r\u00e9ellement disponible.\",\"conditions\":\"Nommer pr\u00e9cis\u00e9ment le module et v\u00e9rifier ses \u00e9changes avec le DMP ou MSSant\u00e9.\",\"first\":\"Faire d\u00e9crire le service utilis\u00e9 et v\u00e9rifier le circuit r\u00e9el d\u2019un document.\",\"limits\":\"La marque seule ne renseigne pas le fonctionnement, les destinataires ou l\u2019interop\u00e9rabilit\u00e9.\",\"sources\":[{\"label\":\"Doctolib\",\"url\":\"https://www.doctolib.fr/\"}],\"status\":\"Supports de l\u2019atelier \u00b7 20/10/2026. Modalit\u00e9s selon le territoire et l\u2019\u00e9quipement.\"},\"gmail\":{\"purpose\":\"\u00c9 9ploiement ni chiffre national.\"},\"i3\":{\"answer\":\"D\u00e9crire les t\u00e2ches actuelles et choisir un usage o\u00f9 l\u2019\u00e9quipe peut tester l\u2019int\u00e9r\u00eat du service. Objectiver le temps pass\u00e9 et les doubles saisies avec les utilisateurs.\",\"prompt\":\"Quelle t\u00e2che voudriez-vous simplifier en premier ?\",\"status\":\"Aucun gain de temps chiffr\u00e9 n\u2019est garanti.\"},\"i4\":{\"answer\":\"Distinguer acc\u00e8s habituel et acc\u00e8s en urgence. V\u00e9rifier les conditions d\u2019acc\u00e8s, les oppositions du patient et les r\u00e8gles applicables avant de r\u00e9pondre sur le cas pr\u00e9sent\u00e9.\",\"prompt\":\"Quelle situation d\u2019urgence et quelle opposition \u00e9ventuelle ?\",\"status\":\"Point r\u00e9glementaire : s\u2019appuyer sur la documentation officielle applicable.\"},\"i5\":{\"answer\":\"Pr\u00e9senter les r\u00e8gles d\u2019initiation et de cl\u00f4ture des \u00e9changes, puis convenir des usages et des d\u00e9lais de r\u00e9ponse. V\u00e9rifier ces modalit\u00e9s dans la FAQ officielle du service.\",\"prompt\":\"Pour quel type de message et avec quel d\u00e9lai de r\u00e9ponse ?\",\"status\":\"R\u00e9ponse \u00e0 appuyer sur la FAQ Mon espace sant\u00e9.\"},\"i6\":{\"answer\":\"Partir du contenu \u00e0 \u00e9changer, des destinataires et du besoin de tra\u00e7abilit\u00e9. Proposer l\u2019essai d\u2019un canal pr\u00e9vu pour les donn\u00e9es de sant\u00e9 dans l\u2019organisation.\",\"prompt\":\"Qu\u2019\u00e9changez-vous et qui doit retrouver cette information ?\",\"status\":\"Piste de discussion ; \u00e9viter une r\u00e9ponse g\u00e9n\u00e9rale fond\u00e9e uniquement sur le nom d\u2019une application.\"},\"i7\":{\"answer\":\"V\u00e9rifier le besoin partag\u00e9 et les acc\u00e8s possibles pour le professionnel ext\u00e9rieur \u00e0 la MSP. Organiser un premier \u00e9change avec lui et pr\u00e9ciser les informations \u00e0 partager.\",\"prompt\":\"Quel professionnel doit rejoindre quel \u00e9change ?\",\"status\":\"Les acc\u00e8s doivent \u00eatre v\u00e9rifi\u00e9s dans la situation r\u00e9elle.\"},\"i8\":{\"answer\":\"Distinguer l\u2019acte, le service technique et le circuit de demande. V\u00e9rifier les r\u00e8gles et la r\u00e9mun\u00e9ration pour les professions concern\u00e9es sur ameli.fr.\",\"prompt\":\"Qui demande l\u2019avis et qui le rend ?\",\"status\":\"Les montants et conditions sont \u00e0 v\u00e9rifier avant diffusion.\"},\"i9\":{\"answer\":\"Comparer le dossier, les destinataires et le suivi de la demande avec le circuit actuel. V\u00e9rifier le volet disponible et les modalit\u00e9s locales avant de faire une promesse.\",\"prompt\":\"Quel suivi voulez-vous conserver apr\u00e8s l\u2019appel ?\",\"status\":\"\u00c9viter de reprendre une \u00e9ch\u00e9ance PRADO non v\u00e9rifi\u00e9e.\"},\"i10-doctolib\":{\"answer\":\"Demander quel module est utilis\u00e9 et o\u00f9 le document est effectivement envoy\u00e9. V\u00e9rifier sur un cas si ce document est aussi disponible dans le DMP et accessible aux professionnels concern\u00e9s.\",\"prompt\":\"Quel document, dans quel module, et qui peut le retrouver ?\",\"status\":\"Proposition ajout\u00e9e ; la fiche fournie est vide. Ne pas pr\u00e9sumer des fonctions d\u2019un \u00e9diteur.\"},\"i11\":{\"answer\":\"Partir de la ressource recherch\u00e9e et comparer l\u2019actualit\u00e9 des informations, les crit\u00e8res et les contacts trouv\u00e9s. Identifier le r\u00f4le du portail territorial et de l\u2019annuaire de la CPTS.\",\"prompt\":\"Quelle ressource recherchez-vous le plus souvent ?\",\"status\":\"Proposition fond\u00e9e sur les supports du jeu.\"},\"i12\":{\"answer\":\"Identifier le prescripteur, le professionnel ex\u00e9cutant et les versions des logiciels. Reconstituer un essai et orienter vers l\u2019\u00e9diteur ou l\u2019accompagnement CPAM selon le blocage.\",\"prompt\":\"\u00c0 quelle \u00e9tape la prescription n\u2019est-elle pas retrouv\u00e9e ?\",\"status\":\"Ne pas donner de sanction ou \/button>`).join('')||'<p class=\"pack-help\">Ajoutez les objections que vous entendez et les r\u00e9ponses construites ensemble.<\/p>'}<\/div><\/section>\n <div class=\"pitch-bottom-grid\"><section class=\"pitch-panel pitch-phrase\"><h2><span>3<\/span> Une phrase pour convaincre<\/h2><textarea data-cpts-pitch-field=\"phrase\" rows=\"5\" maxlength=\"20000\" placeholder=\"La phrase que nous pourrions vraiment dire \u00e0 une CPTS\u2026\">${esc(p.phrase)}<\/textarea><button class=\"text-btn\" data-action=\"cpts-see-contributions\">Relire les \u00e9l\u00e9ments de langage du groupe \u24d8<\/button><\/section><section class=\"pitch-panel\"><div class=\"pitch-panel-head\"><h2><span>4<\/span> Les ressources utiles<\/h2><button class=\"text-btn\" data-action=\"cpts-pick-resources\">+ Choisir<\/button><\/div><div class=\"pitch-resources\">${p.resources.map(e=>`<button data-action=\"cpts-edit-resource\" data-entry=\"${e.id}\" data-tip=\"${esc(ExcoPack.toolTip(getCard('tools',e.cardId)))}\">${cptsImage('tools',e)?`<img src=\"${cptsImage('tools',e)}\" alt=\"\">`:'<b>\u2605<\/b>'}<span>${esc(Cpts.entryLabel('tools',e))}<\/span><\/button>`).join('')}<\/div><label class=\"pack-label\">Supports, d\u00e9monstrations, liens \u00e0 partager<textarea data-cpts-pitch-field=\"ressourcesTexte\" rows=\"3\" maxlength=\"20000\" placeholder=\"Nommez la ressource et indiquez comment la retrouver\u2026\">${esc(p.ressourcesTexte)}<\/textarea><\/label><\/section><section class=\"pitch-panel\"><h2><span>5<\/span> Notre confiance pour embarquer les CPTS<\/h2>${cptsConfidenceMarkup(p)}<\/section><\/div>\n <details class=\"pitch-panel pitch-next\"><summary>Notre d\u00e9marche d\u2019aller-vers<\/summary><p class=\"pack-help\">Compl\u00e9ment au support : rendre la prise de contact concr\u00e8te, avec un acteur, un bon moment, un message et une action.<\/p>${p.actions.map(a=>`<button class=\"next-action\" data-action=\"cpts-edit-action\" data-id=\"${a.id}\"><strong>${esc(a.action||'Action \u00e0 pr\u ditAction(id){const p=cptsState().pitch;let row=p.actions.find(o=>o.id===id);if(!row){row={id:uid(),...Object.fromEntries(Cpts.actionFields.map(k=>[k,'']))};p.actions.push(row);persist();}M={type:'cpts-action',row};showDialog({title:'Pr\u00e9parer une d\u00e9marche d\u2019aller-vers',eyebrow:'De la discussion \u00e0 la prise de contact',subtitle:'Compl\u00e9ment propos\u00e9 \u00e0 partir des objectifs de la journ\u00e9e.',body:`<div class=\"form-grid\">${Cpts.actionFields.map(k=>`<label class=\"field\">${esc(Cpts.labels[k])}<textarea data-cpts-row-field=\"${k}\" rows=\"2\" maxlength=\"20000\">${esc(row[k])}<\/textarea><\/label>`).join('')}<\/div>`,footer:'<span class=\"small\">Enregistrement automatique.<\/span><div><button class=\"text-btn\" data-action=\"cpts-remove-row\">Retirer<\/button><button class=\"btn coral\" data-action=\"cancel-dialog\">Terminer<\/button><\/div>'});}\nfunction cptsAdminMarkup(groups){const units=Cpts.units(groups);return `<section class=\"entry-section\"><h2>Les missions et le discours CPTS<\/h2><p class=\"pack-help\">Chaque saisie conserve son groupe d\u2019origine. Les exemples et les points \u00e0 confirmer ne deviennent pas des consensus.<\/p><div class=\"cpts-admin-missions\">${Cpts.missions.map(m=>`<button data-action=\"cpts-admin-filter\" data-id=\"${m.id}\" class=\"${cptsAdminFilter===m.id?'active':''}\"><b>${units.filter(u=>u.m.id===m.id).length}<\/b><span>${esc(m.name)}<\/span><small>groupes ayant choisi ou renseign\u00e9 la mission<\/small><\/button>`).join('')}<\/div><button class=\"text-btn\" data-action=\"cpts-admin-filter\" data-id=\"all\">Voir les trois missions<\/button>${groups.filter(s=>Cpts.hasWork(s)||s.cpts.assignment==='missions').map(s=>{const p=s.cpts.pitch,us=Cpts.units([s]).filter(u=>cptsAdminFilter==='all'||u.m.id===cptsAdminFilter);return `<article class=\"cpts-admin-group\"><div class=\"pitch-panel-head\"><h3>${esc(s.name)}<\/h3><button class=\"text-btn\" data-action=\"cpts-admin-open\" data-id=\"${s.id}\" data-mode=\"pitch\">Ouvrir la fiche CPTS<\/button><\/div><p>${esc(s.department)} \u00b7 ${esc(Cpts.groupLabel(s))}<\/p><blockquote>${esc(p.phrase||'Phrase pour convaincre non renseign\u00e9e.')}<\/blockquote><p><b>Confiance : ${p.confiance===null?'non \u00e9valu\u00e9e':p.confiance+'/10'}<\/b><br>${nl(p.justification||'Justification \u00e0 compl\u00e9ter.')}<\/p>${us.map(({m,state:x})=>`<section><h4>${esc(m.title)} \u00b7 ${x.tools.length} solution(s)<\/h4><p>${esc(x.tools.map(e=>Cpts.entryLabel('tools',e)).join(', ')||'Aucune carte choisie.')}<\/p><button class=\"text-btn\" data-action=\"cpts-admin-open\" data-id=\"${s.id}\" data-mode=\"missions\" data-mission=\"${m.id}\">Relire la planche<\/button><\/section>`).join('')}<\/article>`;}).join('')||'<p class=\"empty\">Importez les JSON des groupes pour retrouver leurs missions et leur discours CPTS.<\/p>'}<\/section>`;}\nfunction cptsRules(){M={type:'cpts-rules'};showDialog({title:'Les deux ateliers du prototype',eyebrow:'Consignes du support fourni',body:'<ol class=\"rules-list\"><li><strong>Atelier parcours<\/strong><p>Choisir un parcours patient. Compl\u00e9ter les moments cl\u00e9s avec plusieurs cartes et au moins deux irritants. Pr\u00e9voir 45 minutes de jeu, puis 45 minutes pour la fiche \u00ab Quel discours aupr\u00e8s des CPTS ? \u00bb.<\/p><\/li><li><strong>Atelier missions CPTS<\/strong><p>Trois planches de 30 minutes : recherche de m\u00e9decin traitant, soins non programm\u00e9s de ville, pr\u00e9vention. Pour chaque solution choisie, pr\u00e9ciser la fonctionnalit\u00e9, son utilit\u00e9 pour la mission et les questions / objections avec les r\u00e9ponses apport\u00e9es.<\/p><\/li><li><strong>La restitution<\/strong><p>Conserver les arguments, objections / r\u00e9ponses, phrase pour convaincre, ressources utiles et confiance sur 10 avec justification. Pour l\u2019atelier missions, compl\u00e9ter cette fiche pendant les s\u00e9quences, sans ajouter une nouvelle s\u00e9quence de 45 minutes.<\/p><\/li><li><strong>Les cartes<\/strong><p>Plusieurs solutions et plusieurs jokers sont possibles. Les \u00e9toiles recueillent l\u2019appr\u00e9ciation du groupe, sans note pr\u00e9remplie. Pour l\u2019\u00e9quipement, 5 signifie une difficult\u00e9 \u00e9lev\u00e9e.<\/p><\/li><\/ol><p class=\"small\">La d\u00e9marche d\u2019aller-vers et les pistes de discussion sont des compl\u00e9ments d\u2019animation. Exportez le JSON pour transmettre les r\u00e9ponses \u00e0 l\u2019animateur.<\/p>',footer:'<button class=\"btn\" data-action=\"cancel-dialog\">Revenir au prototype<\/button>'});}\nfunction handleCptsAction(action,button){\n if(action==='cpts-workspace'){cptsChangeMode(button.dataset.mode);return true;}\n if(action==='cpts-return'){cptsChangeMode(cptsState().previousMode);return true;}\n if(action==='cpts-mission'){cptsChangeMission(button.dataset.id);return true;}\n if(action==='cpts-entry-workshop'){registration.cptsAssignment=button.dataset.mode;rememberEntry();renderRegistration();return true;}\n if(action==='cpts-entry-mission'){registration.cptsMission=button.dataset.id;rememberEntry();renderRegistration();return true;}\n if(action==='cpts-pick'){cptsOpenPicker(button.dataset.kind);return true;}\n if(action==='cpts-pick-resources'){cptsOpenPicker('tools','resources');return true;}\n if(action==='cpts-edit-resource'){cptsOpenEntry('tools',button.dataset.entry,'usage','resources');return true;}\n if(action==='cpts-edit-entry'){cptsOpenEntry(button.dataset.kind,button.dataset.entry,button.dataset.tab||'usage');return true;}\n if(action==='cpts-card-tab'){if(M?.type==='cpts-card'){M.tab=button.dataset.tab;cptsRenderEntry();}return true;}\n if(action==='cpts-rating'){if(M?.type==='cpts-card'&&Cpts.criteria.includes(button.dataset.key)){M.entry.ratings[button.dataset.key]=Number(button.dataset.value)||null;persist();cptsRenderEntry();}return true;}\n if(action==='cpts-remove-entry'){if(M?.type==='cpts-card'){const list=M.target==='resources'?cptsState().pitch.resources:cptsMissionState()[M.kind],at=list.findIndex(e=>e.id===M.entry.id);if(at>=0)list.splice(at,1);persist();closeDialog();render();}return true;}\n if(action==='save-picker'&&M?.cptsTarget){cptsSavePicker();return true;}\n if(action==='picker-context'&&M?.cptsTarget){const m=Cpts.missions.find(m=>m.id===M.cptsTarget.mission);$('cardInfoPanel').innerHTML='<button class=\"close-btn\" data-action=\"hide-info\" aria-label=\"Fermer le d\u00e9tail\">\u00d7<\/button><h3>'+esc(m.title)+'<\/h3><p>'+esc(m.question)+'<\/p><p class=\"small\">Plusieurs cartes possibles. Pr\u00e9cisez la fonctionnalit\u00e9, son utilit\u00e9 et les objections / r\u00e9ponses.<\/p>';$('cardInfoPanel').hidden=false;return true;}\n if(action==='cpts-source'){const m=cptsMission();M={type:'cpts-source'};showDialog({title:m.title,eyebrow:'Atelier 4 \u00b7 planche '+m.number+' \u00b7 30 minutes',body:'<p class=\"step-full-description\">'+esc(m.question)+'<\/p><p>Utilisez les cartes \u00e0 votre disposition pour vous inspirer. Certaines cartes servent \u00e0 g\u00e9n\u00e9rer la discussion et \u00e0 trouver les bons \u00e9l\u00e9ments de langage face aux questions ou irritants des professionnels.<\/p><h3 class=\"cpts-prompt-title\">Pistes de discussion<\/h3><ul>'+m.prompts.map(t=>'<li>'+esc(t)+'<\/li>').join('')+'<\/ul><p class=\"small\">Consigne source : diapositive '+m.slide+' du support fourni. Les pistes ci-dessus compl\u00e8tent cette consigne.<\/p>',footer:'<button class=\"btn\" data-action=\"cancel-dialog\">Revenir \u00e0 la planche<\/button>',narrow:true});return true;}\n if(action==='cpts-see-contributions'){const rows=ExcoPack.contributions([session()]).filter(x=>x.field==='edl');M={type:'cpts-edl'};showDialog({title:'Les \u00e9l\u00e9ments de langage d\u00e9j\u00e0 formul\u00e9s',eyebrow:session().name,body:rows.length?rows.map(x=>'<article class=\"cpts-edl\"><small>'+esc(x.journey)+' \u00b7 '+esc(x.card)+'<\/small><p>'+nl(x.text)+'<\/p><\/article>').join(''):'<p>Aucun \u00e9l\u00e9ment de langage saisi pour le moment. Renseignez les cartes du parcours ou des missions.<\/p>',footer:'<button class=\"btn\" data-action=\"cancel-dialog\">Revenir \u00e0 la fiche CPTS<\/button>'});return true;}\n if(action==='cpts-add-objection'||action==='cpts-edit-objection'){cptsEditObjection(button.dataset.id);return true;}\n if(action==='cpts-add-action'||action==='cpts-edit-action'){cptsEditAction(button.dataset.id);return true;}\n if(action==='cpts-remove-row'){if(M?.type==='cpts-objection')cptsState().pitch.objections=cptsState().pitch.objections.filter(x=>x.id!==M.row.id);if(M?.type==='cpts-action')cptsState().pitch.actions=cptsState().pitch.actions.filter(x=>x.id!==M.row.id);persist();closeDialog();render();return true;}\n if(action==='cpts-confidence'||action==='cpts-confidence-clear'){cptsState().pitch.confiance=action==='cpts-confidence-clear'?null:Number(button.dataset.value);persist();render();return true;}\n if(action==='cpts-admin-filter'){cptsAdminFilter=button.dataset.id;render();return true;}\n if(action==='cpts-admin-open'){db.active=button.dataset.id;if(button.dataset.mission)cptsState().currentMission=button.dataset.mission;cptsChangeMode(button.dataset.mode);return true;}\n if(['timer-toggle','timer-reset'].includes(action)&&cptsClock().id!=='patient'){const x=cptsClock();x.owner.timer=action==='timer-toggle'?Cpts.toggle(x.owner.timer):Cpts.timer(x.minutes);persist();updateTimerUI();return true;}\n if(action==='rules'){cptsRules();return true;}\n if(action==='summary'&&cptsState().mode!=='patient'&&!(isAdmin&&view==='admin')){cptsChangeMode('pitch');return true;}\n if(action==='journey'){cptsChangeMode('patient',{renderNow:false});return false;}\n return false;\n}\nfunction handleCptsInput(el){\n if(el.dataset.cptsMissionField){const k=el.dataset.cptsMissionField;if(['contexte','theme','notesMission'].includes(k)){cptsMissionState()[k]=el.value;persist();}return true;}\n if(el.dataset.cptsPitchField){const k=el.dataset.cptsPitchField;if(['arguments','phrase','re +'<\/details>':'';}return '';};\ncptsRegistrationChoices=function(){return reviewPrior.cptsRegistrationChoices().replace('3 planches de 30 min : m\u00e9decin traitant, SNP, pr\u00e9vention','1 \u00e0 3 missions \u00e0 traiter : m\u00e9decin traitant, SNP, pr\u00e9vention').replace('Les trois missions restent accessibles.','Choisissez une \u00e0 trois missions selon les \u00e9changes et le temps disponible. Les trois planches restent accessibles.');};\ncptsMissionBoard=function(){reviewPrior.cptsMissionBoard();$('mainContent').innerHTML=$('mainContent').innerHTML.replace(/<p class=\"cpts-source-line\">[\\s\\S]*?<\\/p>/,'').replace('30 min par mission','30 min par planche').replace('Une ligne par solution.','Choisissez une \u00e0 trois missions selon la mati\u00e8re et le temps disponible. Une ligne par solution.').replace('Mission suivante :','Autre mission :').replace('Acteurs \u00e0 embarquer','Acteurs \u00e0 embarquer \u00b7 facultatif');};\ncptsPitchBoard=function(){reviewPrior.cptsPitchBoard();$('mainContent').innerHTML=$('mainContent').innerHTML.replace('\u00c0 renseigner pendant les trois missions de 30 minutes.','\u00c0 renseigner au fil de la ou des missions choisies (une \u00e0 trois planches).');};\ncptsRules=function(){reviewPrior.cptsRules();$('dialogTitle').textContent='Les r\u00e8gles de l\u2019atelier';$('dialogFooter').innerHTML=$('dialogFooter').innerHTML.replace('Revenir au prototype','Revenir \u00e0 l\u2019atelier');$('dialogBody').innerHTML=$('dialogBody').innerHTML.replace('Compl\u00e9ter les moments cl\u00e9s avec plusieurs cartes et au moins deux irritants.','Compl\u00e9ter les moments cl\u00e9s avec les outils utiles, les questions / objections et les r\u00e9ponses du groupe. Les personnages sont facultatifs. Placer au moins deux irritants par parcours.').replace('Les deux ateliers du prototype','Le d\u00e9roul\u00e9 de l\u2019atelier').replace('Trois planches de 30 minutes :','Choisir une \u00e0 trois planches de 30 minutes selon la mati\u00 nctionnalit\u00e9s<\/h4>'+(st.tools.map(e=>'<b>'+esc(entryLabel('tools',e))+'<\/b>'+text([e.notes.why])).join('')||'<p>Aucun outil choisi.<\/p>')+'<\/div><div><h4>Questions / objections<\/h4>'+text([st.discussion.irritants,st.discussion.freins,...st.tools.flatMap(e=>[e.notes.irritants,e.notes.freins]),...st.irritants.map(e=>entryLabel('irritants',e))])+'<\/div><div><h4>R\u00e9ponses et \u00e9l\u00e9ments de langage<\/h4>'+text([st.discussion.leviers,st.discussion.edl,...[...st.tools,...st.irritants].flatMap(e=>[e.notes.leviers,e.notes.edl])])+'<\/div><\/div><\/section>';}).join(''),footer:'<span class=\"small\">Modifiez les \u00e9changes depuis les \u00e9tapes ou les cartes. Les exports conservent ces saisies.<\/span><button class=\"btn coral\" data-action=\"cancel-dialog\">Fermer<\/button>'});}\nrenderSummary=function(){reviewPrior.renderSummary();if(cptsState().mode==='patient')$('mainContent').innerHTML='<p class=\"review-annex-access\"><button class=\"btn secondary\" data-action=\"review-annex\">Voir l\u2019annexe des \u00e9changes par \u00e9tape<\/button><\/p>'+$('mainContent').innerHTML;};\nconst reviewHandled=handlePackAction;handlePackAction=function(a,b,e){if(a==='review-annex'){reviewAnnex();return true;}return reviewHandled(a,b,e);};\n",[4122388,4134181]]};

 document.open();document.write(html);document.close();
